openapi: 3.1.0
info:
  title: SimuCenter Platform Foundation API
  version: 1.1.0
  description: >-
    Contrato HTTP de SPEC-001 Platform Foundation. Documenta únicamente las
    comprobaciones de vida y readiness aprobadas. Las rutas /health y /ready
    fueron seleccionadas porque los requisitos aprobados no fijaban nombres de
    ruta. No documenta autenticación, tenancy, operaciones de negocio,
    persistencia ni un transporte HTTP para métricas.


    La versión 1.1.0 no añade rutas, métodos ni capacidades. Incorpora
    exclusivamente las respuestas que el límite HTTP de la foundation emite de
    forma deliberada y configurada sobre estas mismas rutas: vencimiento del
    plazo de recepción de una solicitud ya encaminada (408), rechazo por
    frecuencia o capacidad de admisión (429), rechazo por tamaño de cuerpo
    (413), denegación de acceso operacional (403) cuando el límite de red o
    plataforma materializa esa denegación como respuesta HTTP en lugar de
    impedir la conexión, fallo upstream detectado por el borde antes de recibir
    encabezados válidos del upstream y antes de comprometer encabezados de
    respuesta downstream (502) y vencimiento de un plazo de upstream que el
    borde traduce al código contratado (504).
    La versión 1.0.0 no las documentaba, lo que impedía que AC-001-030 y
    SEC-001-028 verificaran el contrato completo de cada operación.


    Procedencia de estas respuestas. Una prueba de viabilidad aislada del
    límite HTTP, con un upstream exclusivamente sintético y sin implementación
    de SPEC-001, observó directamente 403, 408, 413, 429, 502 y 504, la
    conservación exacta del X-Request-ID válido recibido y su sustitución
    íntegra cuando es inválido, y el paso sin alteración del 503 {status:
    not_ready} producido por el backend. El 502 se observó exclusivamente en su
    causa UF —fallo o timeout de conexión—, y el 504 en sus causas UT
    —vencimiento del plazo upstream total— y SI —vencimiento de la ociosidad
    del flujo—. Esa prueba no es implementación del producto ni evidencia de
    conformidad de SPEC-001, y su evidencia no se extiende a la implementación
    futura. No fueron ejercitados y son comportamiento contratado pendiente de
    verificación de implementación: el 200 de /ready, el 500 INTERNAL_ERROR, y
    las causas UC y UR que esta versión agrupa en 502 junto a UF.


    Todas las respuestas no satisfactorias de esta versión reutilizan el
    esquema cerrado ErrorResponse, incluyen un X-Request-ID válido y
    obligatorio, y usan códigos públicos estables con mensajes seguros que no
    revelan límites configurados, dependencias, reglas de acceso, configuración
    ni detalles internos. El 503 de readiness conserva su cuerpo mínimo
    {status: not_ready} porque es el resultado normal y no satisfactorio de una
    comprobación procesada, no una respuesta de error de API bajo REQ-001-007.


    Taxonomía cerrada de resultados no satisfactorios: 408 exclusivamente para
    el vencimiento del plazo de recepción de una solicitud que el límite ya
    encaminó a una operación contratada; 429 exclusivamente para límites de
    frecuencia o admisión; 413 para exceso del cuerpo; 403 para acceso
    operacional denegado materializado como HTTP; 503 {status: not_ready}
    exclusivamente para la dependencia obligatoria de readiness; 502 para los
    fallos upstream detectados por el borde antes de recibir encabezados
    válidos del upstream y antes de comprometer encabezados de respuesta
    downstream; 504 exclusivamente para los
    vencimientos de plazo de upstream que el límite traduce a ese código; y 500
    INTERNAL_ERROR exclusivamente para excepción interna no controlada.
    Ninguna condición se representa con un código
    distinto del suyo. Un cierre de conexión anterior a la emisión de una
    respuesta no produce ningún estado HTTP y no se documenta como código
    alguno; una respuesta cuyos encabezados ya se entregaron y después se
    interrumpe conserva el estado ya emitido y llega con el cuerpo incompleto,
    y tampoco se documenta con un código distinto.


    Compromiso semántico declarado del 502. UF —fallo o timeout de conexión—,
    UC —terminación de la conexión upstream antes de encabezados— y UR —reset
    upstream antes de encabezados— son indicadores distintos y pueden
    distinguirse individualmente. El contrato los agrupa deliberadamente bajo
    el mismo 502 UPSTREAM_UNAVAILABLE cuando ocurren antes de recibir
    encabezados válidos del upstream y antes de comprometer encabezados de
    respuesta downstream. Cada indicador se remapea explícitamente por
    separado. La respuesta pública comparte código y cuerpo, mientras el flag y
    el detalle operacional conservan la causa concreta. Ambas condiciones deben
    cumplirse para que el borde pueda generar el 502 contratado: si el upstream
    ya entregó encabezados o el borde ya comprometió encabezados de respuesta
    downstream, el fallo posterior se trata como transporte y no puede
    convertirse en 502. Solo UF fue observada en la prueba de viabilidad; UC y
    UR son comportamiento contratado y quedan pendientes de verificación de
    implementación. El diagnóstico operacional del límite registra la causa
    concreta por solicitud y la contabiliza en contadores separados de timeout
    de conexión, de fallo de conexión y de terminación o reset anteriores a
    encabezados. Representar cualquiera de estas causas como 504 queda
    excluido: afirmaría un vencimiento de plazo que no ocurrió.
servers: []
